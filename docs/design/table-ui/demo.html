<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>德州一手牌 · 完整演示</title>
<link rel="stylesheet" href="chips.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d1b12; color:#e8e2d0; height:100vh; overflow:hidden;
       display:flex; flex-direction:column;
       font-family:-apple-system,"PingFang SC",sans-serif; }

.table-wrap { flex:1; position:relative; }
.felt { position:absolute; inset:8px 6px; border-radius:46% / 34%;
  background:radial-gradient(ellipse at 50% 38%, #1f6b41 0%, #14512f 55%, #0e3d24 100%);
  box-shadow:inset 0 0 0 3px #c9a227, inset 0 0 0 11px #22160c,
             inset 0 12px 34px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.6); }
.felt::after { content:""; position:absolute; inset:26px; border-radius:46%/34%;
  border:1px solid rgba(201,162,39,.22); }

.seat { position:absolute; transform:translate(-50%,-50%); text-align:center; width:78px; }
.seat .name { font-size:11px; color:#d9cfae; white-space:nowrap; }
.seat .num  { font-size:11px; color:#f0d98a; font-variant-numeric:tabular-nums; }
.seat.folded { opacity:.32; }
.seat.folded .cards { opacity:0; }
.avatar { width:38px; height:38px; margin:0 auto 2px; border-radius:50%; position:relative;
  background:linear-gradient(160deg,#3b2f1c,#1b1610); border:2px solid #6b5a30;
  color:#e8dcb4; display:flex; align-items:center; justify-content:center; font-size:15px;
  transition:border-color .2s, box-shadow .2s; }
.seat.acting .avatar { border-color:#ffd75e; box-shadow:0 0 0 3px rgba(255,215,94,.28), 0 0 18px rgba(255,215,94,.45); }
.timer { position:absolute; inset:-4px; border-radius:50%; border:2px solid transparent; }
.seat.acting .timer { border-color:#ffd75e; border-right-color:transparent; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.dealer { position:absolute; right:-4px; bottom:14px; width:17px; height:17px; border-radius:50%;
  background:#f5efdc; color:#24160b; font-size:10px; font-weight:800; line-height:17px; }
.cards { display:flex; gap:2px; justify-content:center; margin-bottom:3px; height:29px; transition:opacity .3s; }
.own { display:flex; align-items:flex-end; justify-content:center; height:22px; margin-top:2px; }

.bet-area { position:absolute; transform:translate(-50%,-50%); display:flex; align-items:flex-end; gap:4px; }
.bet-area .lab { font-size:10px; color:#f0d98a; font-variant-numeric:tabular-nums; align-self:center; }

.pot { position:absolute; left:50%; top:20%; transform:translateX(-50%);
  color:#f5e6b0; font-size:13px; background:rgba(0,0,0,.4); padding:4px 14px; border-radius:999px;
  border:1px solid rgba(201,162,39,.4); white-space:nowrap; font-variant-numeric:tabular-nums; }
.pot.win { animation:potGlow .7s ease-in-out 2; }
#potPile { position:absolute; left:50%; top:36%; transform:translate(-50%,-50%); }
.community { position:absolute; left:50%; top:60%; transform:translate(-50%,-50%); display:flex; gap:5px; }
.community .slot { transition:transform .3s; }
.stage { position:absolute; left:50%; top:70%; transform:translateX(-50%);
  font-size:11px; color:#cdbf95; letter-spacing:2px; }

.hint { position:absolute; left:50%; top:75%; transform:translateX(-50%);
  font-size:12px; color:#f0e2b8; background:rgba(0,0,0,.55); padding:5px 14px; border-radius:999px;
  white-space:nowrap; opacity:0; transition:opacity .25s; }
.hint.show { opacity:1; }

.hero { background:linear-gradient(#12271a,#0b1a11); border-top:1px solid #2d5c3c;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
.hero-cards { display:flex; gap:6px; justify-content:center; margin-bottom:9px; height:78px; }
.actions { display:flex; gap:8px; }
.actions button { flex:1; border:0; border-radius:10px; padding:13px 0; font-size:15px;
  font-weight:600; font-family:inherit; opacity:.35; pointer-events:none; transition:opacity .2s; }
.actions.live button { opacity:1; }
.fold { background:#2b1f18; color:#d8c8b4; border:1px solid #4a3527 !important; }
.call { background:linear-gradient(#2f8c52,#1e6b3c); color:#fff; }
.raise{ background:linear-gradient(#d9b03c,#b48620); color:#2a1c05; }

.bar { display:flex; gap:8px; padding:8px 12px; background:#08130c; border-top:1px solid #1e3a28; }
.bar button { flex:1; padding:10px 0; border:1px solid #3a5c46; background:#12271a;
  color:#cdbf95; border-radius:8px; font-size:13px; font-family:inherit; }
.bar button:disabled { opacity:.4; }
.flip { animation:flip .34s ease-out; }
@keyframes flip { 0% { transform:rotateY(90deg) scale(.9); } 100% { transform:rotateY(0) scale(1); } }
</style>
</head>
<body>
<div class="table-wrap">
  <div class="felt"></div>
  <div class="pot">底池 <span id="potNum">0</span></div>
  <div id="potPile"></div>
  <div class="community" id="cc"></div>
  <div class="stage" id="stage"></div>
  <div id="seats"></div>
  <div id="bets"></div>
  <div class="hint" id="hint"></div>
</div>
<div class="hero">
  <div class="hero-cards" id="hero"></div>
  <div class="actions" id="acts">
    <button class="fold">弃牌</button>
    <button class="call" id="callBtn">跟注</button>
    <button class="raise">加注</button>
  </div>
</div>
<div class="bar">
  <button id="play">▶ 播放完整一手牌</button>
  <button id="sfxBtn">🔊 音效</button>
</div>

<script src="chips.js"></script>
<script src="sfx.js"></script>
<script>
const SUIT={s:'♠',h:'♥',d:'♦',c:'♣'}, RED={h:1,d:1};
const CB='#fbf7ec', CE='#c9bfa4', BF='#7a1f24', BE='#f0e0b8';
let __b=0;
function card([s,r],w){const h=Math.round(w*1.4),c=RED[s]?'#c0272d':'#1a1a1a';
 return `<svg class="flip" width="${w}" height="${h}" viewBox="0 0 50 70"><rect x="1" y="1" width="48" height="68" rx="5" fill="${CB}" stroke="${CE}"/>
 <text x="6" y="17" font-size="15" font-weight="700" fill="${c}">${r}</text><text x="6" y="29" font-size="12" fill="${c}">${SUIT[s]}</text>
 <text x="30" y="52" font-size="22" fill="${c}">${SUIT[s]}</text></svg>`}
function back(w){const h=Math.round(w*1.4), id='k'+(++__b); let L='';
 for(let k=-70;k<=70;k+=5) L+=`<path d="M${k} 0 L${k+70} 70"/><path d="M${k} 70 L${k+70} 0"/>`;
 return `<svg width="${w}" height="${h}" viewBox="0 0 50 70">
  <defs><clipPath id="${id}"><rect x="5" y="5" width="40" height="60" rx="3"/></clipPath></defs>
  <rect x="1" y="1" width="48" height="68" rx="5" fill="${BF}" stroke="${BE}" stroke-width="1.5"/>
  <g clip-path="url(#${id})" stroke="${BE}" stroke-opacity=".28" stroke-width=".8" fill="none">${L}</g>
  <rect x="5" y="5" width="40" height="60" rx="3" fill="none" stroke="${BE}" stroke-opacity=".7"/>
  <g transform="translate(25 35)"><path d="M0 -9 L6.5 0 L0 9 L-6.5 0 Z" fill="${BE}" fill-opacity=".85"/>
  <path d="M0 -5 L3.6 0 L0 5 L-3.6 0 Z" fill="${BF}"/></g></svg>`}
function slot(w){const h=Math.round(w*1.4);
 return `<svg class="slot" width="${w}" height="${h}" viewBox="0 0 50 70"><rect x="1.5" y="1.5" width="47" height="67" rx="5" fill="none" stroke="${CE}" stroke-opacity=".28" stroke-dasharray="4 4"/></svg>`}

const P = [
 {id:'me', x:50,y:88, bx:50,by:72, name:'你',   stack:8420, hole:[['s','A'],['h','K']]},
 {id:'p1', x:16,y:79, bx:29,by:70, name:'老王', stack:3100, hole:[['c','9'],['d','4']]},
 {id:'p2', x:8, y:55, bx:23,by:56, name:'阿杰', stack:12750,hole:[['s','5'],['h','2']]},
 {id:'p3', x:15,y:31, bx:29,by:39, name:'小林', stack:5600, hole:[['d','J'],['c','J']], dealer:true},
 {id:'p4', x:38,y:18, bx:41,by:32, name:'大鹏', stack:2900, hole:[['h','8'],['s','8']]},
 {id:'p5', x:62,y:18, bx:59,by:32, name:'阿May',stack:7300, hole:[['c','Q'],['d','3']]},
 {id:'p6', x:85,y:31, bx:71,by:39, name:'老陈', stack:15200,hole:[['d','A'],['h','Q']]},
 {id:'p7', x:92,y:55, bx:77,by:56, name:'小周', stack:2450, hole:[['s','7'],['c','6']]},
];
const BOARD = [['h','A'],['s','K'],['d','7'],['c','T'],['d','2']];

let S, pot, heap, revealed;

function $(id){ return document.getElementById(id) }
function hint(t){ const h=$('hint'); h.textContent=t; h.classList.add('show');
  clearTimeout(h._t); h._t=setTimeout(()=>h.classList.remove('show'),2200) }

function drawSeats(){
  $('seats').innerHTML = S.map(s=>{
    const cards = s.me
      ? '' : `<div class="cards" id="cd-${s.id}">${s.dealt?(s.show?s.hole.map(c=>card(c,20)).join(''):back(20)+back(20)):''}</div>`;
    return `<div class="seat${s.folded?' folded':''}${s.acting?' acting':''}" id="st-${s.id}" style="left:${s.x}%;top:${s.y}%">
      ${cards}
      <div class="avatar" id="av-${s.id}">${s.me?'你':s.name[0]}<div class="timer"></div>${s.dealer?'<span class="dealer">D</span>':''}</div>
      <div class="name">${s.name}</div>
      <div class="num" id="n-${s.id}">${s.allin?'ALL IN':s.stack.toLocaleString()}</div>
      <div class="own"><span id="ow-${s.id}"></span></div></div>`;
  }).join('');
  S.forEach(s=>renderPile($('ow-'+s.id), s.stack, {w:13,perCol:5,cap:12}));
}
function drawBets(){
  $('bets').innerHTML = S.map(s=>`<div class="bet-area" id="ba-${s.id}" style="left:${s.bx}%;top:${s.by}%">
     <span id="bs-${s.id}"></span>${s.bet?`<span class="lab">${s.bet}</span>`:''}</div>`).join('');
  S.forEach(s=>{ if(s.bet) renderPile($('bs-'+s.id), s.bet, {w:14,perCol:4,cap:8}) });
}
function drawBoard(){
  $('cc').innerHTML = BOARD.map((c,i)=> i<revealed ? card(c,32) : slot(32)).join('');
}
function setActing(id){ S.forEach(s=>s.acting = s.id===id); drawSeats(); }

function reset(){
  S = JSON.parse(JSON.stringify(P)).map(s=>({...s, bet:0, folded:false, dealt:false, show:false, allin:false, acting:false}));
  pot=0; revealed=0;
  if(!heap) heap = createHeap($('potPile'), {w:18, cap:42, boxW:172, boxH:80});
  heap.clear();
  $('potNum').textContent='0'; $('stage').textContent=''; $('hero').innerHTML='';
  $('acts').classList.remove('live');
  drawSeats(); drawBets(); drawBoard();
}

async function post(id, amt, silent){
  const s=S.find(x=>x.id===id); if(!s||s.folded) return;
  const v=Math.min(amt, s.stack), b=s.stack;
  s.stack-=v; s.bet+=v; if(s.stack===0) s.allin=true;
  if(!silent) SFX.chips(3);
  await flyChips($('av-'+id), $('ba-'+id), v, {count:4,dur:340,w:14});
  rollTo($('n-'+id), b, s.stack, 380);
  if(s.allin) setTimeout(()=>$('n-'+id).textContent='ALL IN', 400);
  renderPile($('ow-'+s.id), s.stack, {w:13,perCol:5,cap:12});
  drawBets();
}
async function fold(id){ const s=S.find(x=>x.id===id); s.folded=true; SFX.fold(); drawSeats(); await sleep(160) }

async function collect(){
  const live=S.filter(s=>s.bet>0); if(!live.length) return;
  const before=pot;
  SFX.chips(6);
  const landed=await Promise.all(live.map(s=>flyChips($('ba-'+s.id), $('potPile'), s.bet, {count:6,dur:520,spread:34,w:18})));
  landed.forEach(d=>heap.add(0,d));
  live.forEach(s=>{ pot+=s.bet; s.bet=0 });
  rollTo($('potNum'), before, pot, 560);
  drawBets(); await sleep(240);
}

async function dealHole(){
  $('stage').textContent='发牌';
  for(let round=0; round<2; round++){
    for(const s of S){
      s.dealt=true; SFX.deal(); drawSeats(); await sleep(85);
    }
  }
  const me=S.find(s=>s.id==='me');
  $('hero').innerHTML = me.hole.map(c=>card(c,54)).join('');
  await sleep(300);
}
async function reveal(n, label){
  $('stage').textContent=label;
  for(let i=0;i<n;i++){ revealed++; SFX.deal(); drawBoard(); await sleep(260) }
  await sleep(250);
}

async function play(){
  $('play').disabled=true; reset(); await sleep(300);
  SFX.turn();

  await dealHole();

  // ── 翻牌前 ─────────────────────────────
  $('stage').textContent='翻牌前';
  await post('p4', 10, true); await post('p5', 20, true);   // 小盲/大盲
  hint('盲注 10 / 20');
  await sleep(400);
  for(const id of ['p6']) { setActing(id); await sleep(320); await post(id, 60); }
  hint('老陈 加注到 60');
  for(const id of ['p7','p1','p2']) { setActing(id); await sleep(230); await fold(id) }
  setActing('me'); $('acts').classList.add('live'); $('callBtn').textContent='跟注 60';
  SFX.turn(); await sleep(650); await post('me', 60);
  $('acts').classList.remove('live');
  setActing('p3'); await sleep(300); await post('p3', 60);
  for(const id of ['p4','p5']) { setActing(id); await sleep(230); await fold(id) }
  setActing(null); await sleep(200); await collect();

  // ── 翻牌 ───────────────────────────────
  await reveal(3, '翻牌');
  hint('你拿到两对 A K');
  setActing('p3'); await sleep(320); hint('小林 过牌');
  setActing('me'); $('acts').classList.add('live'); $('callBtn').textContent='下注 120';
  SFX.turn(); await sleep(600); await post('me', 120);
  $('acts').classList.remove('live');
  setActing('p6'); await sleep(330); await post('p6', 120);
  setActing('p3'); await sleep(260); await fold('p3');
  setActing(null); await sleep(180); await collect();

  // ── 转牌 ───────────────────────────────
  await reveal(1, '转牌');
  setActing('me'); $('acts').classList.add('live'); $('callBtn').textContent='下注 300';
  SFX.turn(); await sleep(560); await post('me', 300);
  $('acts').classList.remove('live');
  setActing('p6'); await sleep(340); await post('p6', 300);
  setActing(null); await sleep(180); await collect();

  // ── 河牌 ───────────────────────────────
  await reveal(1, '河牌');
  setActing('me'); $('acts').classList.add('live'); $('callBtn').textContent='下注 700';
  SFX.turn(); await sleep(560); await post('me', 700);
  $('acts').classList.remove('live');
  setActing('p6'); await sleep(420);
  hint('老陈 全下！');
  await post('p6', S.find(s=>s.id==='p6').stack > 2000 ? 2000 : S.find(s=>s.id==='p6').stack);
  setActing('me'); $('acts').classList.add('live'); $('callBtn').textContent='跟注 1300';
  SFX.turn(); await sleep(800); await post('me', 1300);
  $('acts').classList.remove('live'); setActing(null);
  await sleep(200); await collect();

  // ── 摊牌 ───────────────────────────────
  $('stage').textContent='摊牌';
  S.filter(s=>!s.folded && s.id!=='me').forEach(s=>s.show=true);
  SFX.deal(); drawSeats(); await sleep(900);
  hint('你 两对 A K  ·  老陈 一对 A');
  await sleep(1100);

  // ── 收池 ───────────────────────────────
  const me=S.find(s=>s.id==='me'); const b=me.stack; const won=pot;
  document.querySelector('.pot').classList.add('win');
  SFX.win();
  await flyChips($('potPile'), $('av-me'), pot, {count:10,dur:620,spread:26,w:18});
  me.stack+=pot; rollTo($('n-me'), b, me.stack, 760);
  rollTo($('potNum'), pot, 0, 520);
  heap.clear(); pot=0;
  renderPile($('ow-me'), me.stack, {w:13,perCol:5,cap:12});
  hint('你赢下底池 ' + won.toLocaleString());
  $('stage').textContent='本局结束';
  setTimeout(()=>document.querySelector('.pot').classList.remove('win'), 1600);
  $('play').disabled=false;
}

$('play').onclick = play;
$('sfxBtn').onclick = (e)=>{ const on=SFX.toggle(); e.target.textContent = on?'🔊 音效':'🔇 静音'; if(on) SFX.chip() };
document.body.addEventListener('pointerdown', ()=>SFX.chip(0), {once:true});
reset();
</script>
</body>
</html>
