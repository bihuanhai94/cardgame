# deploy/cardgame.nginx.conf
#
# 目标位置：/usr/local/nginx/conf/cardgame.nginx.conf（与 agent-approval.conf 等其它 include 同级）
# 引入方式：在 /usr/local/nginx/conf/nginx.conf 的 http {} 段末尾手工添加一行：
#     include cardgame.nginx.conf;
# 严禁用 sed 等工具自动改写 nginx.conf，必须用编辑器手工加这一行，参见 deploy/README.md 的 nginx 步骤。
#
# 注意：本机 nginx 编译时没有 --with-http_v2，因此这里不能写 `listen 443 ssl http2;`。

# 裸 http://poker.tyyunan.com 的兜底：没有这个 server 块，端口 80 上谁先匹配
# server_name 就由谁应答（本机同时跑着 agent-hub / console_site 的其它 80 端口配置），
# 用户会看到一个毫不相关服务的响应，而不是清晰的"请用 https"提示。
server {
    listen 80;
    server_name poker.tyyunan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name poker.tyyunan.com;

    ssl_certificate     /opt/cardgame/certs/fullchain.pem;
    ssl_certificate_key /opt/cardgame/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 静态资源正常由 CDN 承载（见 CDN_BASE 构建变量），此处 location / 仅作直连回源兜底，
    # 不应作为常规访问路径（4.5Mbps 出站带宽与 agent-hub 共享）。
    location / {
        root /opt/cardgame/app/packages/web/dist;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
